<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ottoshots</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1012">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-192.png">
<style>
:root{
  --bg:#0f1012; --surface:#17191d; --surface2:#21242a; --line:#2d3037; --fg:#f2f3f5; --muted:#9a9ea8;
  --accent:#5B9DFF; --on-accent:#0a1226; --accent2:#FFB547; --on-accent2:#2a1a00; --hl:#16233b; --good:#4fd1a1; --bad:#ff8a7a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-tema="scuro"]){--bg:#f4f5f7; --surface:#ffffff; --surface2:#eceef2; --line:#d6d9e0; --fg:#14161a; --muted:#5b6070;
    --accent:#2f6fe0; --on-accent:#ffffff; --accent2:#c97800; --on-accent2:#ffffff; --hl:#e4eeff; --good:#1b7d5c; --bad:#b3261e; color-scheme:light}
}
:root[data-tema="chiaro"]{--bg:#f4f5f7; --surface:#ffffff; --surface2:#eceef2; --line:#d6d9e0; --fg:#14161a; --muted:#5b6070;
  --accent:#2f6fe0; --on-accent:#ffffff; --accent2:#c97800; --on-accent2:#ffffff; --hl:#e4eeff; --good:#1b7d5c; --bad:#b3261e; color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);min-height:100vh;
  padding:max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(90px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.01em;color:var(--accent)}
h1 .ra{color:var(--accent2)}
h2{font-size:18px;margin:0 0 8px;font-weight:700}
.ver,.meta{font-size:13px;color:var(--muted)}
p{margin:0 0 8px}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
button,input,textarea{font:inherit;color:var(--fg)}
button{cursor:pointer}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:14px;min-height:48px;padding:8px 12px;width:100%;min-width:0;font-size:16px}
textarea{min-height:84px;resize:vertical;margin-top:10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f input{font-weight:500;color:var(--fg)}
.pri{background:var(--accent);color:var(--on-accent);border:0;border-radius:16px;min-height:52px;padding:6px 18px;font-weight:700}
.pri:disabled{opacity:.4}
.sec2{background:var(--surface2);border:0;border-radius:16px;min-height:52px;padding:4px 14px;font-weight:600}
.ghost{background:transparent;border:0;color:var(--muted);min-height:44px;padding:0 8px;font-weight:600}
.btns{display:flex;gap:8px;margin-top:14px}.btns>*{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chip{flex:0 0 auto;min-width:38px;height:38px;border-radius:19px;border:0;background:var(--surface2);font-weight:600}.chip.ok{box-shadow:inset 0 0 0 2px var(--accent)}.chip.cur{background:var(--accent);color:#fff}.chip.sent{background:color-mix(in srgb,var(--accent) 28%,var(--surface2))}.chip.cur.sent{background:var(--accent)}.sum[data-q]{cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;cursor:pointer}
.item.fatta{opacity:.55;cursor:default}
.item b{display:block}.item span.s{font-size:13px;color:var(--muted)}
.dot{min-width:30px;height:30px;border-radius:15px;background:var(--accent2);color:var(--on-accent2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;padding:0 8px}
.dot.d{background:var(--good);color:#06281d}
.sech{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 8px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:4px}
.prog{height:6px;background:var(--surface2);border-radius:3px;margin:8px 0 14px;overflow:hidden}.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.stepcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.kick{font-size:13px;font-weight:700;color:var(--accent2)}
.stepcard h2{font-size:21px;margin:4px 0 8px}
.det{color:var(--muted);font-size:15px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:15px 16px;min-height:56px;font-size:16px;font-weight:600;background:var(--surface2);border:2px solid transparent;border-radius:16px}
.opt.sel{border-color:var(--accent);background:var(--hl)}
.opt .cons{float:right;font-size:12px;font-weight:700;color:var(--accent2)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.pg.uno{grid-template-columns:1fr}
.pg.multi{grid-template-columns:repeat(3,1fr)}.pg.multi .ph{border-radius:12px}
.ph{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--surface2);border:3px solid transparent;padding:0}
.pg.uno .ph{aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sel{border-color:var(--accent)}
.ph .ck{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;line-height:26px;text-align:center;display:none}
.ph.sel .ck{display:block}
.ph .zm{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:16px;line-height:34px;padding:0}
.ph .nm{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 7px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;touch-action:none;-webkit-user-drag:none}
#lb button{position:absolute;z-index:2;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:46px;height:46px;font-size:22px;line-height:46px;padding:0}
#lbx{top:max(12px,env(safe-area-inset-top));right:12px}#lbp{left:10px;top:50%;margin-top:-23px}#lbn2{right:10px;top:50%;margin-top:-23px}
#lbc{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:14px;opacity:.85;pointer-events:none}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:15px}.sum b{display:block}.sum span{color:var(--muted);font-size:13.5px}
.banner{background:var(--hl);border:1px solid var(--accent);border-radius:12px;padding:8px 10px;font-size:14px;margin-bottom:10px}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;background:var(--surface2);border:2px solid transparent;border-radius:14px;min-height:46px;font-weight:600}.seg button.on{border-color:var(--accent);background:var(--hl)}
.plist{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:6px;padding-left:22px}
.plist:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.pl{position:relative}.pl:before{content:'';position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.pl .h{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl.bad:before{background:var(--bad)}
.now{display:flex;gap:12px;align-items:center}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(79,209,161,.6);animation:p 1.8s infinite;flex:none}
@keyframes p{70%{box-shadow:0 0 0 12px rgba(79,209,161,0)}100%{box-shadow:0 0 0 0 rgba(79,209,161,0)}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:6px;z-index:5;
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
.tab{flex:1;position:relative;background:transparent;border:0;border-radius:14px;min-height:56px;font-weight:600;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--accent2);color:var(--on-accent2);font-size:11px;font-weight:800;line-height:18px;text-align:center;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.big{font-size:42px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Otto<span class="ra">shots</span></h1><span class="ver" id="ver"></span></header>
  <main id="main"></main>
</div>
<nav aria-label="Sezioni">
  <button class="tab" data-tab="dom"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Domande</span></button>
  <button class="tab" data-tab="alb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Album</span></button>
  <button class="tab" data-tab="oggi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Oggi</span></button>
  <button class="tab" data-tab="imp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Impostazioni</span></button>
</nav>
<div class="toast" id="toast"></div>
<div id="lb"><img alt=""><button id="lbx" aria-label="Chiudi">✕</button><button id="lbp" aria-label="Precedente">‹</button><button id="lbn2" aria-label="Successiva">›</button><div id="lbc"></div></div>
<script>
'use strict';
const APP_V='2.8';
const DEF_REPO='andreaguiotto02-8/ottoshots-data';
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mem={};
const store={get(k){try{const v=localStorage.getItem('sd_'+k);return v==null?(mem[k]??null):JSON.parse(v)}catch(e){return mem[k]??null}},
  set(k,v){mem[k]=v;try{localStorage.setItem('sd_'+k,JSON.stringify(v))}catch(e){}}};
const IMG={};
function applyTema(){const t=store.get('tema')||'auto';const r=document.documentElement;if(t==='auto')r.removeAttribute('data-tema');else r.setAttribute('data-tema',t);
  const dark=t==='scuro'||(t==='auto'&&!matchMedia('(prefers-color-scheme: light)').matches);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0f1012':'#f4f5f7'}
async function imgUrl(p){if(IMG[p])return IMG[p];const c=cfg();if(!c)return null;try{const r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/'+p,{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github.raw'},cache:'no-store'});if(!r.ok)return null;return IMG[p]=URL.createObjectURL(await r.blob())}catch(e){return null}}
function caricaImg(){document.querySelectorAll('img[data-p]').forEach(async im=>{const u=await imgUrl(im.dataset.p);if(u)im.src=u;else im.alt='Anteprima non disponibile'})}
const bn=p=>String(p).split('/').pop();
let S={tab:'dom',dom:[],stato:null,alb:null,err:'',busy:false,open:null,idx:0,risp:{},fase:'lista',agg:null};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const cfg=()=>{const c=store.get('cfg');return c&&c.token&&c.repo?c:null};
function fdt(t){try{const d=new Date(t);return d.toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function fh(t){try{return new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function utf8(b64){const bin=atob(b64.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}
function toB64(t){return btoa(unescape(encodeURIComponent(t)))}

async function gh(path,opt){
  const c=cfg(); if(!c) throw new Error('nocfg');
  const url='https://api.github.com/repos/'+c.repo+'/contents/'+path+(opt&&opt.noCache?'?t='+Date.now():'');
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
  let r;
  try{r=await fetch(url,Object.assign({headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},cache:'no-store',signal:ac.signal},opt&&opt.init||{}))}
  catch(e){throw new Error(e&&e.name==='AbortError'?'La connessione è troppo lenta. Riprova.':'Non riesco a collegarmi. Controlla la connessione.')}
  finally{clearTimeout(tm)}
  if(r.status===404) return null;
  if(!r.ok) throw new Error(r.status===401?'La chiave non è valida o è scaduta.':r.status===403?'La chiave non ha il permesso giusto.':'Errore GitHub '+r.status);
  return r.json();
}
async function leggiJson(path){const j=await gh(path,{noCache:true});if(!j||!j.content)return null;try{return JSON.parse(utf8(j.content))}catch(e){return null}}
async function scrivi(path,obj,msg){
  const c=cfg(),old=await gh(path,{noCache:true}),body={message:msg,content:toB64(JSON.stringify(obj,null,1))};
  if(old&&old.sha) body.sha=old.sha;
  const r=await gh(path,{init:{method:'PUT',body:JSON.stringify(body)}}); return r;
}
function num(n){const m=/(\d+)\.json$/.exec(n);return m?m[1]:null}

let cRun=0,cStart=0;
async function carica(quiet){
  if(!cfg()){S.err='';render();return}
  /* se un aggiornamento è fermo da più di 25 secondi lo scarto e ne parte uno nuovo */
  if(S.busy&&Date.now()-cStart<25000){if(!quiet)toast('Sto già aggiornando…');return}
  const my=++cRun; cStart=Date.now(); S.busy=true; if(!quiet)render();
  try{
    const [ld,lr,st,al]=await Promise.all([gh('domande',{noCache:true}),gh('risposte',{noCache:true}),leggiJson('stato.json'),leggiJson('album.json')]);
    const remAll={};
    await Promise.all((lr||[]).map(async f=>{const n=num(f.name);if(!n)return;const d=await leggiJson('risposte/'+f.name);const m={};if(d&&Array.isArray(d.risposte))d.risposte.forEach(o=>{m[String(o.id)]=o});remAll[n]=m}));
    const L=[];
    const ds=await Promise.all((ld||[]).map(async f=>{const n=num(f.name);if(!n)return null;return {n,d:await leggiJson('domande/'+f.name)}}));
    for(const it of ds){if(!it||!it.d||!Array.isArray(it.d.domande))continue;const n=it.n,d=it.d;
      L.push({n,titolo:d.titolo||('Richiesta '+n),intro:d.intro||'',domande:d.domande,creata:d.creata||'',rem:remAll[n]||{},fatta:d.domande.length>0&&d.domande.every((q,i)=>{const o=(remAll[n]||{})[String(q.id||i+1)];return !!(o&&(o.risposta||o.commento))})})}
    L.sort((a,b)=>b.n.localeCompare(a.n));
    if(my!==cRun)return;
    S.dom=L; S.stato=st; S.alb=al; S.err=''; S.agg=new Date().toISOString();
    store.set('cache',{dom:L,stato:S.stato,alb:S.alb,agg:S.agg});
    if(!quiet)toast('Aggiornato ✓');
  }catch(e){
    if(my!==cRun)return;
    S.err=e.message==='Failed to fetch'?'Non riesco a collegarmi. Controlla la connessione.':e.message;
    const ch=store.get('cache'); if(ch&&!S.dom.length){S.dom=ch.dom||[];S.stato=ch.stato||null;S.alb=ch.alb||null;S.agg=ch.agg}
  }
  if(my===cRun){S.busy=false; render()}
}

function badge(){const al=salute().length;document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.tab==='oggi'){t.querySelector('.bd2')?.remove();if(al){const b=document.createElement('i');b.className='bd';b.classList.add('bd2');b.style.cssText='font-style:normal;background:var(--bad);color:#fff';b.textContent='!';t.appendChild(b)}}});const n=S.dom.filter(x=>!x.fatta).length;document.querySelectorAll('.tab').forEach(t=>{t.querySelector('.bd')?.remove();if(t.dataset.tab==='dom'&&n){const b=document.createElement('i');b.className='bd';b.style.fontStyle='normal';b.textContent=n;t.appendChild(b)}})}
function render(){
  document.querySelectorAll('.tab').forEach(t=>{t.setAttribute('aria-current',t.dataset.tab===S.tab?'page':'false')});
  $('#ver').textContent='v'+APP_V; badge();
  if(!cfg()&&S.tab!=='imp'){main.innerHTML='<div class="card"><h2>Prima di iniziare</h2><p>Per collegare l\'app al sistema serve la chiave di accesso. La inserisci una volta sola in Impostazioni.</p><div class="btns"><button class="pri" data-go="imp">Vai a Impostazioni</button></div></div>';return}
  if(S.tab==='dom') vDom(); else if(S.tab==='alb') vAlb(); else if(S.tab==='oggi') vOggi(); else vImp();
}
function ore(t){const m=(Date.now()-new Date(t).getTime())/60000;return isNaN(m)?null:m}
function oreTxt(m){return m<90?Math.round(m)+' minuti':m<60*36?Math.round(m/60)+' ore':Math.round(m/1440)+' giorni'}
function salute(){const st=S.stato,a=[];if(!st)return a;
  const c=st.cloud_ultimo_giro?ore(st.cloud_ultimo_giro):null;if(c!=null&&c>150)a.push('Il controllo automatico di Claude non si fa sentire da '+oreTxt(c)+'.');
  const p=st.attesa_pc_da?ore(st.attesa_pc_da):null;if(p!=null&&p>180)a.push('Il PC non risponde da '+oreTxt(p)+'. Controlla che sia acceso e collegato.');
  if(st.sincronizzazione&&st.sincronizzazione.ok===false)a.push('Problema di sincronizzazione tra telefono e PC'+(st.sincronizzazione.nota?': '+st.sincronizzazione.nota:'.'));
  (st.problemi||[]).forEach(x=>a.push(x));return a}
const banner=()=>{let h=S.err?'<div class="banner">'+esc(S.err)+'</div>':'';const sa=salute();if(sa.length)h+='<div class="banner" style="border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))"><b style="color:var(--bad)">Attenzione</b><br>'+sa.map(esc).join('<br>')+'</div>';return h}
const agg=()=>S.agg?'<p class="meta" style="text-align:center;margin-top:12px">Aggiornato alle '+esc(fh(S.agg))+'</p>':'';

/* ---------- Domande ---------- */
function vDom(){
  if(S.fase==='dom')return vCard(); if(S.fase==='riep')return vRiep(); if(S.fase==='ok')return vOk();
  const ap=S.dom.filter(x=>!x.fatta),ch=S.dom.filter(x=>x.fatta);let h=banner();
  h+='<div style="display:flex;justify-content:space-between;align-items:center"><div class="sech" style="margin:0">Da rispondere</div><button class="ghost" data-act="ref">'+(S.busy?'Aggiorno…':'↻ Aggiorna')+'</button></div>';
  if(!ap.length) h+='<div class="empty"><div class="big">✅</div><b>Niente da rispondere</b>Quando il sistema ha domande nuove le trovi qui e ti arriva una notifica.</div>';

/* ---------- Visualizzatore foto: schermo intero, zoom, trascina, scorri ---------- */
const LB={list:[],i:0,sc:1,tx:0,ty:0,pts:new Map(),d0:0,s0:1,last:0,sx:0,sy:0,moved:false};
function lbApply(){const im=$('#lb img');im.style.transform='translate('+LB.tx+'px,'+LB.ty+'px) scale('+LB.sc+')'}
function lbClamp(){const im=$('#lb img'),w=im.clientWidth*LB.sc,h=im.clientHeight*LB.sc,mx=Math.max(0,(w-innerWidth)/2),my=Math.max(0,(h-innerHeight)/2);LB.tx=Math.max(-mx,Math.min(mx,LB.tx));LB.ty=Math.max(-my,Math.min(my,LB.ty))}
function lbReset(){LB.sc=1;LB.tx=0;LB.ty=0;lbApply()}
async function lbShow(i){
  if(!LB.list.length)return; LB.i=(i+LB.list.length)%LB.list.length; lbReset();
  const im=$('#lb img');im.removeAttribute('src');$('#lbc').textContent=(LB.i+1)+' di '+LB.list.length+' · pizzica o tocca due volte per ingrandire';
  const multi=LB.list.length>1;$('#lbp').style.display=multi?'':'none';$('#lbn2').style.display=multi?'':'none';
  const my=LB.i,u=await imgUrl(LB.list[LB.i]);if(my===LB.i&&u)im.src=u;
}
function lbOpen(list,i){LB.list=list;$('#lb').classList.add('on');lbShow(i)}
function lbClose(){$('#lb').classList.remove('on');$('#lb img').removeAttribute('src');lbReset()}
(function(){
  const lb=document.getElementById('lb');
  const dist=()=>{const a=[...LB.pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
  lb.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;lb.setPointerCapture&&lb.setPointerCapture(e.pointerId);LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});LB.moved=false;LB.sx=e.clientX;LB.sy=e.clientY;
    if(LB.pts.size===2){LB.d0=dist();LB.s0=LB.sc}});
  lb.addEventListener('pointermove',e=>{const p=LB.pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(Math.abs(e.clientX-LB.sx)+Math.abs(e.clientY-LB.sy)>8)LB.moved=true;
    if(LB.pts.size===2){LB.sc=Math.max(1,Math.min(6,LB.s0*dist()/LB.d0));lbClamp();lbApply()}
    else if(LB.sc>1){LB.tx+=dx;LB.ty+=dy;lbClamp();lbApply()}});
  const up=e=>{const had=LB.pts.has(e.pointerId);LB.pts.delete(e.pointerId);if(!had)return;
    if(LB.pts.size===0&&!e.target.closest('button')){
      const dx=e.clientX-LB.sx,dy=e.clientY-LB.sy;
      if(LB.sc===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){lbShow(LB.i+(dx<0?1:-1));LB.last=0;return}
      if(!LB.moved){const now=Date.now();if(now-LB.last<320){ /* doppio tocco */
          if(LB.sc>1){lbReset()}else{const im=$('#lb img'),r=im.getBoundingClientRect();LB.sc=2.5;LB.tx=(innerWidth/2-e.clientX)*1.5;LB.ty=(innerHeight/2-e.clientY)*1.5;lbClamp();lbApply()}
          LB.last=0}else LB.last=now}}};
  lb.addEventListener('pointerup',up);lb.addEventListener('pointercancel',up);
  lb.addEventListener('wheel',e=>{e.preventDefault();LB.sc=Math.max(1,Math.min(6,LB.sc*(e.deltaY<0?1.2:1/1.2)));if(LB.sc===1){LB.tx=0;LB.ty=0}lbClamp();lbApply()},{passive:false});
  document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbShow(LB.i+1);else if(e.key==='ArrowLeft')lbShow(LB.i-1)});
  document.getElementById('lbx').addEventListener('click',e=>{e.stopPropagation();lbClose()});
  document.getElementById('lbp').addEventListener('click',e=>{e.stopPropagation();lbShow(LB.i-1)});
  document.getElementById('lbn2').addEventListener('click',e=>{e.stopPropagation();lbShow(LB.i+1)});
})();

  else if(a==='esci'){S.fase='lista';S.open=null;render()}
  else if(a==='indietro'){S.fase='dom';const nx=S.open.domande.findIndex((q,i)=>!S.sent[kk(q,i)]);S.idx=nx<0?S.open.domande.length-1:nx;render()}
  else if(a==='nonso'){salva();S.risp[curK()].v='Non so';passa()}
  else if(a==='avanti'){salva();passa()}
  else if(a==='salta'){salva();passa()}
  else if(a==='invia1')inviaQ();
  else if(a==='riepvai'){salva();S.fase='riep';render()}
  else if(a==='cons'){S.open.domande.forEach((q,i)=>{S.risp[kk(q,i)]={v:q.consigliata,c:S.risp[kk(q,i)]?.c||''}});S.fase='riep';render()}
  else if(a==='invia')invia();
  else if(a==='salvacfg')salvaCfg();
  else if(a==='tema'){store.set('tema',t.dataset.v);applyTema();render()}
  else if(a==='scollega'){store.set('cfg',null);S.dom=[];S.stato=null;toast('Scollegato');render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg()&&S.fase==='lista')carica(true)});
window.addEventListener('pageshow',()=>{if(cfg()&&S.fase==='lista')carica(true)});
window.addEventListener('focus',()=>{if(cfg()&&S.fase==='lista')carica(true)});
window.addEventListener('online',()=>{if(cfg()&&S.fase==='lista')carica(true)});
setInterval(()=>{if(!document.hidden&&cfg()&&S.fase==='lista'&&S.tab!=='imp')carica(true)},60000);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{r.update&&r.update()}).catch(()=>{});
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&S.fase==='lista')location.reload();had=true});
}
const ch=store.get('cache');if(ch){S.dom=ch.dom||[];S.stato=ch.stato||null;S.alb=ch.alb||null;S.agg=ch.agg||null}
applyTema();S.tab=cfg()?'dom':'imp';render();if(cfg())carica(true);
</script>
</body>
